<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be Unreadable</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: #fff;
  background:
    radial-gradient(circle at 30% 50%, rgba(90,90,90,0.45), transparent 35%),
    linear-gradient(115deg, #000 0%, #050505 38%, #2a2a2a 62%, #777 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.75) 42%, rgba(120,120,120,0.25) 100%);
  z-index: -1;
}

.box {
  text-align: center;
  max-width: 460px;
  width: 90%;
  padding: 36px 24px;
}

h1 {
  font-size: clamp(38px, 8vw, 72px);
  letter-spacing: 2px;
  margin: 0 0 12px;
  font-weight: 400;
}

.tagline {
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.62);
  margin-bottom: 34px;
}

.subtext {
  color: rgba(255,255,255,0.68);
  font-size: 14px;
  line-height: 1.6;
  margin: -8px 0 22px;
}

input[type="email"] {
  width: 100%;
  padding: 15px;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.28);
  color: #fff;
  margin-bottom: 14px;
  font-size: 15px;
  outline: none;
  text-align: center;
  letter-spacing: 1px;
}

input[type="email"]::placeholder {
  color: rgba(255,255,255,0.45);
}

input[type="email"]:focus {
  border-color: rgba(255,255,255,0.9);
}

button {
  width: 100%;
  padding: 15px;
  background: #fff;
  color: #000;
  border: none;
  cursor: pointer;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}

button:hover {
  background: #d8d8d8;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 14px;
  text-align: left;
  color: rgba(255,255,255,0.48);
  font-size: 11px;
  line-height: 1.45;
}

.consent input {
  margin-top: 2px;
}

.status {
  min-height: 18px;
  margin-top: 16px;
  color: rgba(255,255,255,0.72);
  font-size: 13px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="box">
  <h1>Be Unreadable</h1>
  <div class="tagline">Identity over Data</div>

  <div class="subtext">
    Early access to the first drop.
  </div>

  <form
    name="early-access"
    method="POST"
    data-netlify="true"
    netlify-honeypot="bot-field"
    id="earlyAccessForm"
  >
    <input type="hidden" name="form-name" value="early-access">

    <p class="hidden">
      <label>
        Don’t fill this out if you’re human:
        <input name="bot-field">
      </label>
    </p>

    <input
      type="email"
      name="email"
      placeholder="Your email"
      autocomplete="email"
      required
    >

    <button type="submit" id="submitButton">Get Early Access</button>

    <label class="consent">
      <input type="checkbox" name="email-consent" value="yes" required>
      <span>
        I agree to receive launch and early-access emails from Be Unreadable.
        I can unsubscribe at any time.
      </span>
    </label>

    <div class="status" id="formStatus" aria-live="polite"></div>
  </form>
</div>

<script>
const form = document.getElementById("earlyAccessForm");
const status = document.getElementById("formStatus");
const button = document.getElementById("submitButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  button.disabled = true;
  button.textContent = "Joining...";
  status.textContent = "";

  try {
    const formData = new FormData(form);

    const response = await fetch("/", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams(formData).toString()
    });

    if (!response.ok) {
      throw new Error("Submission failed");
    }

    form.reset();
    button.textContent = "Joined";
    status.textContent = "You're in. Early access confirmed.";
  } catch (error) {
    button.disabled = false;
    button.textContent = "Get Early Access";
    status.textContent = "Something went wrong. Please try again.";
  }
});
</script>

</body>
</html>
