<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Be Unreadable — Identity Over Data. Join early access for the first drop.">
  <title>Be Unreadable — Identity Over Data</title>

  <style>
    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #fff;
      background:
        radial-gradient(circle at 72% 48%, rgba(170,170,170,.22), transparent 30%),
        radial-gradient(circle at 28% 50%, rgba(70,70,70,.34), transparent 38%),
        linear-gradient(115deg, #000 0%, #050505 42%, #252525 70%, #686868 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(0,0,0,.86), rgba(0,0,0,.50) 58%, rgba(255,255,255,.03));
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92%, 520px);
      text-align: center;
      padding: 44px 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 78px);
      line-height: .96;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .tagline {
      margin-top: 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,.62);
    }

    .intro {
      max-width: 390px;
      margin: 38px auto 22px;
      font-family: Arial, Helvetica, sans-serif;
      color: rgba(255,255,255,.68);
      font-size: 14px;
      line-height: 1.7;
    }

    form { margin-top: 8px; }

    .hidden { display: none; }

    input[type="email"] {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 0;
      background: rgba(0,0,0,.24);
      color: #fff;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      letter-spacing: .5px;
      outline: none;
      appearance: none;
    }

    input[type="email"]::placeholder { color: rgba(255,255,255,.42); }
    input[type="email"]:focus { border-color: rgba(255,255,255,.85); }

    button {
      width: 100%;
      height: 52px;
      margin-top: 12px;
      border: 0;
      border-radius: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.3px;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover { background: #dedede; }
    button:disabled { cursor: default; opacity: .72; }

    .consent {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin-top: 14px;
      text-align: left;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10.5px;
      line-height: 1.5;
      color: rgba(255,255,255,.46);
    }

    .consent input { margin: 2px 0 0; flex: 0 0 auto; }

    .status {
      min-height: 22px;
      margin-top: 15px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255,255,255,.72);
    }

    .footer {
      margin-top: 34px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(255,255,255,.28);
    }

    @media (max-width: 520px) {
      main { padding: 34px 18px; }
      .intro { margin-top: 30px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Be Unreadable</h1>
    <div class="tagline">Identity Over Data</div>

    <p class="intro">
      Early access to the first drop.<br>
      Take a stand in a world that reads you.
    </p>

    <form
      name="early-access"
      method="POST"
      action="/"
      data-netlify="true"
      netlify-honeypot="bot-field"
      id="earlyAccessForm"
    >
      <input type="hidden" name="form-name" value="early-access">

      <p class="hidden">
        <label>Don’t fill this out if you’re human: <input name="bot-field"></label>
      </p>

      <input
        type="email"
        name="email"
        placeholder="Your email"
        autocomplete="email"
        inputmode="email"
        aria-label="Email address"
        required
      >

      <button type="submit" id="submitButton">Get Early Access</button>

      <label class="consent">
        <input type="checkbox" name="email-consent" value="yes" required>
        <span>
          I agree to receive launch and early-access emails from Be Unreadable. I can unsubscribe at any time.
        </span>
      </label>

      <div class="status" id="formStatus" aria-live="polite"></div>
    </form>

    <div class="footer">Be Unreadable · Identity Over Data</div>
  </main>

  <script>
    const form = document.getElementById('earlyAccessForm');
    const status = document.getElementById('formStatus');
    const button = document.getElementById('submitButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      button.disabled = true;
      button.textContent = 'Joining...';
      status.textContent = '';

      const formData = new FormData(form);
      const encoded = new URLSearchParams();
      formData.forEach((value, key) => encoded.append(key, value));

      try {
        const response = await fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: encoded.toString()
        });

        if (!response.ok) throw new Error('Submission failed');

        form.reset();
        button.textContent = 'Joined';
        status.textContent = "You're in. Early access confirmed.";
      } catch (error) {
        button.disabled = false;
        button.textContent = 'Get Early Access';
        status.textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>
</body>
</html>
