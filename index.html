<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be Unreadable</title>

<style>
body {
margin: 0;
font-family: Georgia, serif;
background: #050505;
color: #fff;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}

.box {
text-align: center;
max-width: 400px;
width: 90%;
}

h1 {
font-size: 32px;
margin-bottom: 20px;
}

input {
width: 100%;
padding: 12px;
background: transparent;
border: 1px solid #444;
color: #fff;
margin-bottom: 15px;
font-size: 16px;
}

button {
width: 100%;
padding: 12px;
background: #fff;
color: #000;
border: none;
cursor: pointer;
font-weight: bold;
}

.hidden {
display: none;
}

.content {
display: none;
padding: 40px;
text-align: center;
}
</style>
</head>

<body>

<div class="box" id="loginBox">
<h1>Be Unreadable</h1>
<input type="password" id="password" placeholder="Enter password">
<button onclick="checkPassword()">Enter</button>
</div>

<div class="content" id="content">
<h1>Zachovaj si identitu.</h1>
<p>Be Unreadable je o tom nebyť čitateľný systémom.</p>
</div>

<script>
function checkPassword() {
const input = document.getElementById("password").value;

if (input === "unreadable") {
document.getElementById("loginBox").style.display = "none";
document.getElementById("content").style.display = "block";
} else {
alert("Zlé heslo");
}
</script>

</body>
</html>
